name: record_linux
description: Local stub replacement for record_linux. This app targets Android only; Linux recording is never used at runtime. This stub exists purely so the Dart compiler can successfully type-check the record package facade, which unconditionally references record_linux regardless of target platform.
version: 0.7.2
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  record_platform_interface: ^1.0.0

flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: RecordLinux
