name: azon_trainer
description: Azon/Iqomat talaffuzini o'rgatuvchi va tahlil qiluvchi mashq ilovasi (v1.4 - Duration/Mad Analysis).
publish_to: "none"
version: 0.1.4+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  record: ^5.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# CI muhitida record_linux-0.7.2 (record paketining Linux
# implementatsiyasi) record_platform_interface'dagi yangi metodlarni
# (startStream) implement qilmagani sababli kompilyatsiya xatosi
# berdi. Biz faqat Android uchun build qilamiz — record_linux
# runtime'da hech qachon ishlatilmaydi — lekin Dart baribir uni
# kompilyatsiya qiladi. record_linux'ni eskiroq versiyaga tortamiz;
# o'sha versiyaning o'z pubspec.yaml'i mos platform_interface'ni
# avtomatik tanlaydi (aniq interface versiyasini bilish shart emas).
#
# ESLATMA: internetga ulanmagan muhitda pub.dev'dagi aniq versiya
# tarixini tekshirib bo'lmadi — bu versiya eng ishonchli taxmin.
# Agar bu ham yordam bermasa, xato matni ("version solving failed"
# yoki xuddi shu turdagi "missing implementation" xatosi) qaysi
# versiya kerakligini aniqroq ko'rsatadi.
dependency_overrides:
  record_linux: 0.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
